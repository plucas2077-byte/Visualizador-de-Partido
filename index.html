<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualizador de partidos de voleibol</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F5;--surface:#FFFFFF;--ink:#14203A;--muted:#5C6880;--line:#DCE1EA;--soft:#F4F6F9;
 --home:#2356D8;--away:#DC8E0B;--acc:#2356D8;
 --q0:#0C8A57;--q1:#5DBB8C;--q2:#BAC2CF;--q3:#F1A54E;--q4:#E4692F;--q5:#CC3A33;
 --c1:#1B9AAA;--c2:#7B61FF;--c3:#EF6F6C;--c4:#E0A100;--c5:#6C7A91;
 --hero:#101A31;--heroInk:#F3F6FB;--heroMuted:#9AA8C1;
 --floor:#F1DFC0;--floorLine:#FFFFFF;--free:#3B7A78;
 --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1527;--surface:#152038;--ink:#E7ECF5;--muted:#95A2BA;--line:#26334E;--soft:#1B2844;
 --home:#5E8DFF;--away:#F2AE32;--q0:#2FBF7E;--q1:#6FC99B;--q2:#5D6A82;--q3:#F0A54E;--q4:#F07A45;--q5:#F0625A;--hero:#080F1F;--floor:#3A3326;--floorLine:#D8CDBB;--free:#1D4442}}
:root[data-theme="dark"]{--bg:#0D1527;--surface:#152038;--ink:#E7ECF5;--muted:#95A2BA;--line:#26334E;--soft:#1B2844;
 --home:#5E8DFF;--away:#F2AE32;--q0:#2FBF7E;--q1:#6FC99B;--q2:#5D6A82;--q3:#F0A54E;--q4:#F07A45;--q5:#F0625A;--hero:#080F1F;--floor:#3A3326;--floorLine:#D8CDBB;--free:#1D4442}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}.pos{color:var(--q0)!important;fill:var(--q0)!important}.neg{color:var(--q5)!important;fill:var(--q5)!important}
.top-bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto;padding:12px 20px}
.brand{font:800 22px/1 var(--cond);display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{width:26px;height:30px;border-radius:6px 6px 9px 9px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font:800 15px var(--cond);font-style:normal}
#fname{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);white-space:nowrap}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.big{font-size:18px;padding:14px 28px}
.btn.small{padding:6px 14px;font-size:14px}
.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
#pickbtn{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:1240px;margin:0 auto;padding:4px 20px 80px}
#err{max-width:1200px;margin:0 auto 12px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--q5) 14%,var(--surface));border:1px solid var(--q5)}
body.drag main::after{content:'Suelta el archivo aquí';position:fixed;inset:12px;border:3px dashed var(--acc);border-radius:22px;background:color-mix(in srgb,var(--acc) 12%,transparent);display:grid;place-items:center;font:800 34px var(--cond);color:var(--acc);pointer-events:none;z-index:30}

/* empty */
.empty{max-width:620px;margin:9vh auto;text-align:center}
.jersey{width:120px;height:132px;margin:0 auto 18px;background:var(--ink);border-radius:30px 30px 18px 18px;clip-path:polygon(22% 0,78% 0,100% 16%,90% 34%,82% 30%,82% 100%,18% 100%,18% 30%,10% 34%,0 16%);display:grid;place-items:center}
.jersey span{font:900 64px var(--cond);color:var(--bg);margin-top:18px}
.empty h1{font:800 clamp(42px,7vw,64px)/1 var(--cond);margin:0 0 .3em}
.empty p{color:var(--muted);margin:0 auto 1.6em;max-width:50ch}

/* strip del partido */
.mstrip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px 18px;background:var(--hero);color:var(--heroInk);border-radius:18px;padding:16px 22px;margin-top:6px}
.ms-t{font:700 clamp(17px,2.4vw,24px)/1.1 var(--cond);display:flex;align-items:center;gap:10px}.ms-t.t1{justify-content:flex-end;text-align:right}
.ms-t i{width:12px;height:12px;border-radius:3px;flex:none}.ms-t.t0 i{background:var(--home)}.ms-t.t1 i{background:var(--away)}
.ms-s{font:800 clamp(38px,6vw,56px)/1 var(--cond);display:flex;gap:10px;color:var(--heroMuted)}.ms-s b.w{color:var(--heroInk)}.ms-s span{opacity:.4}
.ms-sets{grid-column:1/-1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ms-sets span{font:600 15px var(--cond);background:rgba(255,255,255,.08);border-radius:999px;padding:2px 11px;font-variant-numeric:tabular-nums}
.ms-meta{grid-column:1/-1;text-align:center;font-size:13px;color:var(--heroMuted);white-space:pre}

/* selector */
.pick{margin-top:26px}
.pickhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pickhead h1{font:800 clamp(34px,5vw,48px)/1 var(--cond);margin:0 0 6px}
.lede{color:var(--muted);margin:0;max-width:75ch}.lede.small{font-size:13.5px;margin-top:10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.seg button i{width:9px;height:9px;border-radius:50%}.seg .t0 i{background:var(--home)}.seg .t1 i{background:var(--away)}
.seg button.on{background:var(--ink);color:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{position:relative;display:flex;gap:14px;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0;cursor:pointer;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(16,26,49,.45);border-color:var(--tc)}
.pcard.t0{--tc:var(--home)}.pcard.t1{--tc:var(--away)}
.pc-num{flex:none;width:78px;display:grid;place-items:center;background:var(--tc);color:#fff;font:900 46px/1 var(--cond);letter-spacing:-1px}
.pc-body{display:flex;flex-direction:column;padding:12px 44px 12px 0;min-width:0}
.pc-role{font-size:12.5px;color:var(--muted);font-weight:600}.pc-role em{font-style:normal;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 5px;font-size:11px;margin-left:4px}
.pc-name{font:600 17px/1.05 var(--cond);margin:3px 0 8px;color:var(--muted)}.pc-name span{font-size:25px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.2px}
.pc-stats{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:auto}.pc-stats b{font:700 17px var(--cond);color:var(--ink);margin-right:3px}
.pc-rt{position:absolute;top:10px;right:10px;font:800 16px/1 var(--cond);padding:6px 7px;border-radius:8px;color:#fff}
.r-top{background:#0C8A57}.r-good{background:#5DAA3E}.r-mid{background:#C79A1B}.r-low{background:#CC5A33}

/* hero jugador */
.phero{position:relative;overflow:hidden;background:var(--hero);color:var(--heroInk);border-radius:24px;padding:22px 28px 26px;margin-top:6px;display:grid;grid-template-columns:1fr auto;gap:20px;isolation:isolate}
.phero.t0{--tc:var(--home)}.phero.t1{--tc:var(--away)}
.phero::before{content:'';position:absolute;inset:0;background:var(--tc);clip-path:polygon(62% 0,100% 0,100% 100%,44% 100%);opacity:.9;z-index:-2}
.ph-num{position:absolute;right:13%;top:50%;transform:translateY(-52%);font:900 clamp(200px,30vw,380px)/.8 var(--cond);color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.55);z-index:-1;letter-spacing:-8px;pointer-events:none}
.back{background:rgba(255,255,255,.1);border:0;color:var(--heroInk);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;margin-bottom:18px}
.ph-team{display:flex;align-items:center;gap:8px;color:var(--heroMuted);font-size:14px;font-weight:600}.ph-team i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.phero h1{font:600 clamp(30px,4.2vw,46px)/.95 var(--cond);margin:6px 0 6px}
.phero h1 span{display:block;font-weight:900;font-size:clamp(52px,8vw,96px);text-transform:uppercase;letter-spacing:-.5px}
.ph-role{font:600 18px var(--cond);color:var(--heroMuted);white-space:pre-wrap}
.ph-main{min-width:0}
.ph-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,150px));gap:10px;margin-top:22px}
.ph-kpis div{background:rgba(8,14,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.ph-kpis b{display:block;font:800 36px/1 var(--cond)}.ph-kpis span{font-size:12.5px;color:var(--heroMuted);line-height:1.2;display:block;margin-top:4px}
.ph-kpis .pos{color:#5CE0A0!important}.ph-kpis .neg{color:#FF8A80!important}
.ph-rt{align-self:end;text-align:center;max-width:150px}
.ph-rt small{display:block;font-size:11.5px;color:rgba(255,255,255,.8);margin-top:10px;line-height:1.3}
.medal{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;align-content:center;margin:0 auto;border:5px solid rgba(255,255,255,.9);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.medal b{font:900 52px/1 var(--cond);color:#fff}.medal span{font:700 13px var(--body);color:rgba(255,255,255,.9)}
.schips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 18px}
.schip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column}
.schip b{font:700 17px var(--cond)}.schip span{font-size:14px}.schip small{color:var(--muted);font-size:12px}
.schip i{position:absolute;right:12px;top:10px;font:700 16px var(--cond);font-style:normal}.schip i.w{color:var(--q0)}.schip i.l{color:var(--q5)}
.schip.off{opacity:.55;border-style:dashed}

/* paneles */
.panel{background:var(--surface);border-radius:20px;padding:20px 22px;border:1px solid var(--line)}
.panel h2{font:800 26px/1.05 var(--cond);margin:0 0 6px}
.panel h3{font:700 17px/1.2 var(--cond);margin:0 0 10px;color:var(--muted)}
.wide{margin-bottom:18px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead h2{margin:0}
.tag{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);font-weight:600}.tag.ok{color:var(--q0)}
.grid{display:grid;gap:18px;margin-bottom:18px}.g2{grid-template-columns:1fr 1fr;align-items:start}.g3{grid-template-columns:.9fr 1.1fr 1.1fr;margin:0}
.gmap{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start;margin:0}
.stack{display:grid;gap:22px;align-content:start}
.lg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;justify-content:center}
.lg.inl{margin:0;justify-content:flex-start}.lg.col{flex-direction:column;align-items:flex-start;gap:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.lg .g{background:var(--q0)}.lg .b{background:var(--q5)}.lg .n{background:var(--q2)}.lg .o4{background:var(--q4)}
.lg .ln{border-radius:2px;height:4px;width:16px;vertical-align:2px}.lg .bw{background:var(--q1);border-radius:2px}.lg .bl{background:var(--q3);border-radius:2px}

/* flow */
.flowwrap{margin-top:6px}
.flow{width:100%;height:230px;display:block}
.flow .fz{stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.flow .fsep{stroke:var(--line);stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.flow .vp{fill:var(--q0)}.flow .vn{fill:var(--q5)}
.flow .bw{fill:var(--q1)}.flow .bl{fill:var(--q3)}
.flow .fcum{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.flabels{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:4px}.flabels b{color:var(--ink);font-weight:600}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:18px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.sk-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.skill h3{font:800 24px/1 var(--cond);margin:0 0 6px}.skill p{margin:0;font-size:13.5px;color:var(--muted);max-width:22ch}
.ring{width:104px;height:104px;flex:none}
.rtrack{fill:none;stroke:var(--soft)}
.rv{font:800 30px var(--cond);fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.rpc{font-size:16px}
.rs{font:600 11px var(--body);fill:var(--muted);text-anchor:middle}
.ribbon{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px;margin-top:14px}
.ribbon span{display:grid;place-items:center;color:#fff;font:700 13px var(--cond);min-width:4px}
.rlg{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--muted);margin-top:7px}.rlg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}.rlg b{color:var(--ink)}

/* radar & chart */
.radar{width:100%;max-width:470px;display:block;margin:0 auto}
.radar .rg{fill:none;stroke:var(--line);stroke-width:1}
.radar .rteam{fill:var(--q2);fill-opacity:.25;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.radar .rl{font:600 12.5px var(--body);fill:var(--muted)}.radar .rlv{font:800 15px var(--cond);fill:var(--ink)}.radar .muted{fill:var(--muted);font-weight:600}
.chart{width:100%;display:block;margin-top:10px}
.chart .ax{stroke:var(--line);stroke-width:1.5}
.chart .bv{font:800 17px var(--cond);fill:var(--ink);text-anchor:middle}
.chart .bl{font:700 15px var(--cond);fill:var(--ink);text-anchor:middle}
.chart .bn{font:600 12px var(--body);fill:var(--muted);text-anchor:middle}
.cmp{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center;margin:10px 0}.cmp span{font-size:14px}.cmp b{font:800 20px var(--cond);text-align:right}
.cbar{position:relative;height:14px;background:var(--soft);border-radius:7px}.cbar i{display:block;height:100%;border-radius:7px}.cbar em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}

/* barras de resultado */
.brow{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 62px;gap:10px;align-items:center;margin:7px 0}
.bl1{font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.chip{font-style:normal;font:700 12px var(--cond);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.ob{display:flex;height:18px;border-radius:5px;overflow:hidden;gap:2px;min-width:8px}
.ob span{min-width:3px}.ob .k{background:var(--q0)}.ob .o{background:var(--q2)}.ob .bk{background:var(--q4)}.ob .e{background:var(--q5)}
.bnum{text-align:right;line-height:1.05}.bnum b{font:800 19px var(--cond);display:block}.bnum small{font-size:11.5px;color:var(--muted)}
.qcols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qc{text-align:center}.qc b{display:block;font:800 22px var(--cond);margin-top:6px}.qc small{font-size:12px;color:var(--muted)}
.qbar{height:90px;background:var(--soft);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}.qbar span{display:block;width:100%;border-radius:10px 10px 0 0}
.tt{margin-bottom:14px}.tth{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}.tth b{font:700 18px var(--cond)}.tth span{font-size:13px;color:var(--muted)}
.tt .ribbon{margin-top:6px;height:22px}
.spos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;text-align:center;height:120px}
.spos div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.spos span{width:70%;border-radius:8px 8px 3px 3px}.spos b{font:800 18px var(--cond);margin-top:4px}.spos small{font-size:11.5px;color:var(--muted)}

/* colocador */
.dwrap{display:flex;align-items:center;gap:14px}
.donut{width:220px;max-width:62%;flex:none}.donut .dl{font:800 15px var(--cond);fill:#fff;text-anchor:middle}
.donut .dc{font:900 44px var(--cond);fill:var(--ink);text-anchor:middle}.donut .dcs{font:600 13px var(--body);fill:var(--muted);text-anchor:middle}
.srow{margin-bottom:14px}.srow span{font-size:14px;font-weight:600}.srow small{color:var(--muted);font-weight:400}
.sbar{display:flex;height:30px;border-radius:9px;overflow:hidden;gap:2px;margin-top:5px}.sbar i{display:grid;place-items:center;color:#fff;font:700 13px var(--cond);font-style:normal}.sbar i.none{flex:1;background:var(--soft);color:var(--muted)}

/* campo */
.courtcol{display:flex;flex-direction:column;align-items:center}
.court{width:100%;max-width:380px;display:block}
.court .free{fill:var(--free)}.court .floor{fill:var(--floor)}
.court .cl{stroke:var(--floorLine);stroke-width:4}.court .cl3{stroke:var(--floorLine);stroke-width:2.5}
.court .net{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.court .pill{fill:var(--surface);fill-opacity:.86}
.court .zn{font:800 24px var(--cond);fill:var(--ink);text-anchor:middle}.court .zs{font:600 11.5px var(--body);fill:var(--muted);text-anchor:middle}
.sl{fill:none;stroke-width:2;stroke-opacity:.5;stroke-linecap:round}.sl.g{stroke:var(--q0)}.sl.b{stroke:var(--q5)}.sl.n{stroke:var(--q2)}
.sd{stroke:var(--surface);stroke-width:1.5}.sd.g{fill:var(--q0)}.sd.b{fill:var(--q5)}.sd.n{fill:var(--q2)}.sd.vid{cursor:pointer}
.minicourt .court{max-width:260px;margin:12px auto 0}
.net3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;border-top:6px solid var(--ink);padding-top:10px}
.net3 div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}.net3 b{display:block;font:800 30px/1 var(--cond)}.net3 span{font-size:13px;color:var(--muted)}.net3 small{display:block;font-size:12px;color:var(--q0);font-weight:600;min-height:1.2em}

/* registro */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:14px}
.fchips button small{color:var(--muted);font-weight:500;margin-left:3px}
.fchips button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}.fchips button.on small{color:inherit;opacity:.7}
.lset{margin-bottom:16px}
.lsh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:2px solid var(--ink);margin-bottom:4px}
.lsh b{font:800 20px var(--cond)}.lsh span{font-size:13px;color:var(--muted)}

<script>
/* ===== Lectura del .dvw ===== */
function decodeBuffer(buf){try{const t=new TextDecoder('utf-8',{fatal:true}).decode(buf);decodeBuffer.enc='utf-8';return t}catch(e){decodeBuffer.enc='windows-1252';return new TextDecoder('windows-1252').decode(buf)}}
const ROLE_NAMES={1:'Líbero',2:'Receptor',3:'Opuesto',4:'Central',5:'Colocador'};
const SKILL_NAMES={S:'Saque',R:'Recepción',E:'Colocación',A:'Ataque',B:'Bloqueo',D:'Defensa',F:'Free ball'};
const EV_ORDER={S:['#','/','+','!','-','='],R:['#','+','!','-','/','='],A:['#','+','!','-','/','='],B:['#','+','!','-','/','='],D:['#','+','!','-','/','='],E:['#','+','!','-','/','=']};
const EV_LABEL={S:{'#':'Ace','/':'Pasada rival','+':'Positivo','!':'Neutro','-':'Cómodo para el rival','=':'Error'},
 R:{'#':'Perfecta','+':'Positiva','!':'Aceptable','-':'Mala','/':'Pasada','=':'Error'},
 A:{'#':'Punto','+':'Positivo','!':'Cubierto','-':'Negativo','/':'Bloqueado','=':'Error'},
 B:{'#':'Punto','+':'Toque positivo','!':'Toque','-':'Toque negativo','/':'Invasión','=':'Error'},
 D:{'#':'Perfecta','+':'Buena','!':'Aceptable','-':'Mala','/':'Pasada','=':'Error'},
 E:{'#':'Perfecta','+':'Buena','!':'Aceptable','-':'Mala','/':'Mala','=':'Error'}};
const TEMPO={Q:'Primer tiempo',T:'Tensa',M:'Media',H:'Alta',N:'Corredera',U:'Súper',O:'Otros'};
const SERVE_T={H:'Flotante',M:'Salto flotante',Q:'Salto potencia',T:'Tenso',N:'Otro',O:'Otro',U:'Otro'};
const TARGET={F:'Zona 4',C:'Central',B:'Zona 2',P:'Pipe',S:'Colocador'};
const COMBO_ES={X1:'1er tiempo delante',X2:'1er tiempo detrás',X7:'Siete',XM:'1er tiempo en 3',XC:'1er tiempo lejos',XD:'Doble C',XG:'Gun 7-1',XF:'1er tiempo bajo detrás',
 CB:'Corredera junto al colocador',CF:'Corredera cerca',CD:'Corredera lejos',X5:'Tensa por 4',V5:'Alta por 4',C5:'Súper por 4',X6:'Tensa por 2',V6:'Alta por 2',C6:'Súper por 2',
 XP:'Pipe',VP:'Pipe alta',XB:'Pipe hacia 1',XR:'Pipe hacia 5',VB:'Pipe alta hacia 1',VR:'Pipe alta hacia 5',X8:'Zaguero por 1',V8:'Zaguero alto por 1',C8:'Zaguero súper por 1',
 X0:'Zaguero por 5',V0:'Zaguero alto por 5',C0:'Zaguero súper por 5',PP:'Segunda del colocador',PR:'Ataque de free ball',P2:'Segundo toque al campo rival',
 X3:'Media por 2',X4:'Media detrás',X9:'Media delante tras 7',XT:'Media por 4',V3:'Alta por 3'};
const tc=s=>(s||'').toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());

function parseDVW(text){
  const bom=/^\uFEFF/.test(text);const eol=/\r\n/.test(text)?'\r\n':'\n';
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
  const sec={},secStart={};let cur=null;
  lines.forEach((l,i)=>{const m=l.match(/^\[(3?[A-Z0-9\-]+)\]/);if(m){cur=m[1].replace(/^3/,'');sec[cur]=[];secStart[cur]=i+1;return}if(cur!==null)sec[cur].push(l)});
  if(!sec.SCOUT||!sec.SCOUT.some(l=>l.trim()))throw new Error('El archivo no contiene la sección [3SCOUT]. Comprueba que sea un .dvw guardado desde DataVolley.');
  const clean=s=>(s||'').replace(/[\x00-\x1f]/g,'').trim();
  const mf=((sec.MATCH||[]).find(x=>x.trim())||'').split(';');
  const match={date:clean(mf[0]),time:clean(mf[1]),season:clean(mf[2]),league:clean(mf[3]),phase:clean(mf[4])};
  const tl=(sec.TEAMS||[]).filter(x=>x.trim());
  const teams=[0,1].map(i=>{const f=(tl[i]||'').split(';');return{code:clean(f[0]),name:clean(f[1])||(i?'Visitante':'Local'),setsWon:parseInt(f[2])||0,coach:clean(f[3]),assistant:clean(f[4])}});
  const setInfo=(sec.SET||[]).filter(x=>x.trim()).map(l=>{const f=l.split(';');const fin=(f[4]||'').replace(/\s+/g,'');
    return{played:/true/i.test(f[0])&&/\d+-\d+/.test(fin),partials:f.slice(1,4).map(s=>s.replace(/\s+/g,'')).filter(Boolean),final:fin,duration:parseInt(f[5])||0}});
  const players=[[],[]];
  [['PLAYERS-H',0],['PLAYERS-V',1]].forEach(([key,t])=>{for(const l of sec[key]||[]){const f=l.split(';');if(f.length<10||!/^\d+$/.test((f[1]||'').trim()))continue;
    let special='',role=0;for(let k=12;k<Math.min(f.length,16);k++){const v=(f[k]||'').trim();if(!special&&(v==='L'||v==='C'))special=v;else if(!role&&/^[1-5]$/.test(v))role=+v}
    const sp=f.slice(3,8).map(s=>s.trim());
    players[t].push({num:+f[1],id:clean(f[8]),last:tc(clean(f[9])),first:tc(clean(f[10])),nick:clean(f[11]),role:special==='L'?1:role,libero:special==='L'||role===1,captain:special==='C',
      startPos:sp.map(s=>/^[1-6]$/.test(s)?+s:(s==='*'?'sub':null)),setsPlayed:sp.filter(Boolean).length})}});
  const combos={};for(const l of sec.ATTACKCOMBINATION||[]){const f=l.split(';');if(!f[0]||!f[0].trim())continue;combos[f[0].trim()]={zone:+f[1]||0,type:(f[3]||'').trim(),desc:clean(f[4]),target:(f[8]||'').trim()}}
  const calls={};for(const l of sec.SETTERCALL||[]){const f=l.split(';');if(f[0]&&f[0].trim())calls[f[0].trim()]=clean(f[2])}
  let video='';for(const l of sec.VIDEO||[]){const m=l.match(/=(.+)$/);if(m){video=m[1].trim().split(/[\\\/]/).pop();break}}
  const re=/^([*a])(\d{2}|\$\$)([SREABDF])([HMQTUNO~])?([#+!\-\/=~])?/;
  const actions=[],rallies=[],subs=[],timeouts=[];
  let curSet=1,cur2=[],setterPos=[0,0],score=[0,0],prevWinner=null,prevSet=0,lastLineup=[[],[]];
  const z=v=>/^[1-9]$/.test(v||'')?+v:0;
  const lu=f=>[f.slice(14,20).map(x=>parseInt(x)||0),f.slice(20,26).map(x=>parseInt(x)||0)];
  const scoutIdx=[];
  for(let k=0;k<sec.SCOUT.length;k++){const raw=sec.SCOUT[k];
    if(!raw.trim())continue;const li=secStart.SCOUT+k;const ent={li,act:null};scoutIdx.push(ent);const f=raw.split(';');const code=(f[0]||'').trim();
    const sn=parseInt(f[8]);let set=(sn>=1&&sn<=5)?sn:curSet;let m;
    if((m=code.match(/^\*\*(\d)set/i))){curSet=+m[1]+1;cur2=[];continue}
    if(set!==prevSet){score=[0,0];prevWinner=null;prevSet=set}
    const vt=parseFloat(f[12]);const L=lu(f);if(L[0].some(Boolean))lastLineup=L;
    if((m=code.match(/^([*a])z(\d)/))){setterPos[m[1]==='*'?0:1]=+m[2];continue}
    if((m=code.match(/^([*a])c(\d+):(\d+)/))){subs.push({set,team:m[1]==='*'?0:1,out:+m[2],in:+m[3],score:score.slice(),at:rallies.length});continue}
    if((m=code.match(/^([*a])T$/))){timeouts.push({set,team:m[1]==='*'?0:1,score:score.slice(),at:rallies.length});continue}
    if((m=code.match(/^([*a])p(\d+):(\d+)/))){
      const winner=m[1]==='*'?0:1;const serve=cur2.find(a=>a.skill==='S');
      const servingTeam=serve?serve.team:(prevWinner!==null?prevWinner:null);
      const first=cur2[0];
      rallies.push({set,winner,before:score.slice(),score:[+m[2],+m[3]],actions:cur2,servingTeam,rot:serve?serve.rot.slice():setterPos.slice(),
        lineup:first?first.lineup:L,idx:rallies.length,clockStart:first?first.time:(f[7]||'').trim(),vStart:first&&first.video!=null?first.video:(isNaN(vt)?null:vt-8),vEnd:isNaN(vt)?null:vt,time:(f[7]||'').trim()});
      cur2.forEach(a=>a.rally=rallies.length-1);
      cur2=[];prevWinner=winner;score=[+m[2],+m[3]];curSet=set;continue}
    if((m=code.match(re))){
      const hs=parseInt(f[9]),vs=parseInt(f[10]);if(hs>=1&&hs<=6)setterPos[0]=hs;if(vs>=1&&vs<=6)setterPos[1]=vs;
      const c=code.padEnd(14,'~');const sk=m[3];
      const a={team:m[1]==='*'?0:1,num:m[2]==='$$'?null:+m[2],skill:sk,type:(m[4]&&m[4]!=='~')?m[4]:'',ev:(m[5]&&m[5]!=='~')?m[5]:'',
        combo:c.substr(6,2).replace(/~/g,''),target:/[FCBPS]/.test(c[8])?c[8]:'',sz:z(c[9]),ez:z(c[10]),sub:/[A-D]/.test(c[11])?c[11]:'',
        code,pointPhase:(f[1]||'').trim(),phase:(f[2]||'').trim(),set,rot:setterPos.slice(),time:(f[7]||'').trim(),video:isNaN(vt)?null:vt,lineup:L[0].some(Boolean)?L:lastLineup};
      if(sk==='B'&&!a.ez&&a.sz)a.ez=a.sz;
      a.id=actions.length;a.li=li;ent.act=a;cur2.push(a);actions.push(a);curSet=set}
  }
  const nameOf=(t,num)=>players[t].find(p=>p.num===num)||null;
  return{match,teams,setInfo,players,actions,rallies,subs,timeouts,combos,calls,video,nameOf,lines,eol,bom,scoutIdx,enc:decodeBuffer.enc||'utf-8'};
}

/* ===== Análisis ===== */
function pct(a,b){return b?a/b*100:null}
const blank=()=>({n:0,kill:0,err:0,blk:0});
function addAtt(o,a){o.n++;if(a.ev==='#')o.kill++;if(a.ev==='=')o.err++;if(a.ev==='/')o.blk++}
function eff(o){return o&&o.n?(o.kill-o.err-o.blk)/o.n*100:null}
function analyze(M){
  const Rl=M.rallies,A=M.actions;const sets={};
  for(const r of Rl)(sets[r.set]=sets[r.set]||[]).push(r);
  const setList=Object.keys(sets).map(Number).sort((a,b)=>a-b).map(s=>{const rs=sets[s];const last=rs[rs.length-1].score;const info=M.setInfo[s-1];
    return{set:s,rallies:rs,score:last,winner:last[0]>last[1]?0:1,duration:info&&info.duration||0,partials:info?info.partials:[],
      timeouts:M.timeouts.filter(x=>x.set===s),subs:M.subs.filter(x=>x.set===s)}});
  const setsWon=[0,0];setList.forEach(s=>setsWon[s.winner]++);
  // fase de cada ataque

const hm=s=>clk(s).slice(0,5);
const vfmt=s=>{if(s==null||isNaN(s))return'';s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};

/* ---------- carga ---------- */
function augment(S){S.team.forEach(T=>{
  const m=(...os)=>os.filter(Boolean).reduce((a,o)=>({n:a.n+o.n,kill:a.kill+o.kill,err:a.err+o.err+o.blk}),{n:0,kill:0,err:0});
  T.k1=m(T.byPhase.r);T.k2=m(T.byPhase.s,T.byPhase.p);
  T.recToAtt={};['#','+','!','-'].forEach(q=>T.recToAtt[q]=m(T.byRecQ[q]));
  T.zdist={good:{},bad:{}};T.zdistN={good:0,bad:0};
  T.acts('A').filter(a=>a.k1&&a.sz).forEach(a=>{const g=a.recQ&&'#+'.includes(a.recQ)?'good':(a.recQ&&'!-'.includes(a.recQ)?'bad':null);if(g){T.zdist[g][a.sz]=(T.zdist[g][a.sz]||0)+1;T.zdistN[g]++}});
  T.zoneActs=T.acts;});return S}
function load(text,fname){
  try{const M=parseDVW(text);if(!M.rallies.length)throw new Error('No se han encontrado puntos en el scout (líneas *p / ap).');
    st.M=M;st.S=augment(analyze(M));st.file=fname;st.tab='resumen';st.num=null;st.open=null;st.mPlayer='all';st.fresh=true;st.sel=null;st.vf={team:'all',player:'all',skill:'all',set:'all',ev:'all'};
    let t=M.teams.findIndex(x=>/barber/i.test(x.name));if(t<0)t=0;st.team=st.pTeam=st.mTeam=t;
    loadSync();$('#err').hidden=true;render();window.scrollTo(0,0)}catch(e){showErr(e.message)}}
function showErr(m){const el=$('#err');el.textContent=m;el.hidden=false}
function readFile(f){if(!f)return;if(!/\.dvw$/i.test(f.name)){showErr(`«${f.name}» no es un archivo .dvw. Guarda el partido desde DataVolley en formato .dvw y vuelve a intentarlo.`);return}
  const r=new FileReader();r.onload=()=>load(decodeBuffer(new Uint8Array(r.result)),f.name);r.onerror=()=>showErr('No se ha podido leer el archivo.');r.readAsArrayBuffer(f)}

/* ---------- datos de un jugador ---------- */
function playerData(t,num){
  const {M,S}=st;const info=M.nameOf(t,num)||{num,first:'',last:'Dorsal '+num,role:0,startPos:[]};
  const acts=M.actions.filter(a=>a.team===t&&a.num===num);
  const onCourt=M.rallies.filter(r=>r.lineup&&r.lineup[t]&&r.lineup[t].includes(num));
  const setsSet=new Set(acts.map(a=>a.set));onCourt.forEach(r=>setsSet.add(r.set));
  const sets=[...setsSet].sort();
  const T=S.team[t];const P=T.players.find(p=>p.num===num)||null;
  const by=sk=>acts.filter(a=>a.skill===sk);
  const dist=sk=>{const o={_n:0};by(sk).forEach(a=>{o._n++;if(a.ev)o[a.ev]=(o[a.ev]||0)+1});return o};
  const v=acts.reduce((s,a)=>s+val(a),0);
  const rating=sets.length&&acts.length>=4?clamp(6+v/sets.length*0.55,3,10):null;
  const won=onCourt.filter(r=>r.winner===t).length;
  const setBy=M.actions.filter(a=>a.team===t&&a.skill==='A'&&a.setBy===num);
  const subs=M.subs.filter(s=>s.team===t&&(s.in===num||s.out===num));
  const stints={};
  if(onCourt.length){let cur=null;M.rallies.forEach(r=>{const on=r.lineup&&r.lineup[t]&&r.lineup[t].includes(num);
      if(on){if(cur&&cur.set===r.set&&cur.last===r.idx-1){cur.last=r.idx;cur.to=r.time}else{cur={set:r.set,from:r.clockStart||r.time,to:r.time,last:r.idx,first:r.idx};(stints[r.set]=stints[r.set]||[]).push(cur)}}});}
  else{acts.forEach(a=>{const x=stints[a.set]=stints[a.set]||[{set:a.set,from:a.time,to:a.time,byActs:true}];x[0].to=a.time})}
  let secs=0;Object.values(stints).flat().forEach(x=>{const a=clkSec(x.from),b=clkSec(x.to);if(a!=null&&b!=null&&b>=a)secs+=b-a});
  const main=['A','S','R','B','D','E'].map(sk=>[sk,by(sk).length]).sort((a,b)=>b[1]-a[1])[0][0];
  return{t,num,info,acts,onCourt,won,sets,T,P,by,dist,v,rating,setBy,subs,stints,courtSecs:secs,libero:!!info.libero,setter:info.role===5||setBy.length>=10,main};
}

/* ---------- componentes SVG ---------- */
function ring(p,{size=108,stroke=11,color='var(--acc)',label='',sub=''}={}){
  const r=(size-stroke)/2,c=2*Math.PI*r,v=p==null?0:clamp(p,0,100);
  return`<svg viewBox="0 0 ${size} ${size}" class="ring" role="img" aria-label="${esc(label)} ${fp(p)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" class="rtrack" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" ${v?'':'stroke-opacity="0"'} transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="${sub?'47%':'53%'}" class="rv">${p==null?'–':Math.round(p)+'<tspan class="rpc">%</tspan>'}</text>${sub?`<text x="50%" y="66%" class="rs">${esc(sub)}</text>`:''}</svg>`}
function ribbon(sk,d){const tot=d._n||0;if(!tot)return'';const ord=EV_ORDER[sk];
  return`<div class="ribbon">${ord.map((e,i)=>d[e]?`<span style="flex:${d[e]};background:${QC[i]}" title="${esc(EV_LABEL[sk][e])}: ${d[e]}">${d[e]/tot>=.09?d[e]:''}</span>`:'').join('')}</div>
  <div class="rlg">${ord.filter(e=>d[e]).map(e=>`<span><i style="background:${QC[ord.indexOf(e)]}"></i>${esc(EV_LABEL[sk][e])} <b>${d[e]}</b></span>`).join('')}</div>`}
function outcomeBar(o,max){const other=o.n-o.kill-o.err-o.blk;const w=max?o.n/max*100:100;
  return`<div class="ob" style="width:${w}%">${o.kill?`<span class="k" style="flex:${o.kill}"></span>`:''}${other?`<span class="o" style="flex:${other}"></span>`:''}${o.blk?`<span class="bk" style="flex:${o.blk}"></span>`:''}${o.err?`<span class="e" style="flex:${o.err}"></span>`:''}</div>`}

/* campo */
const cx=z=>({4:0,3:100,2:200,7:0,8:100,9:200,5:0,6:100,1:200}[z]);
function zoneRect(half,z){const x=cx(z);let y;if(half==='bot')y={4:300,3:300,2:300,7:400,8:400,9:400,5:500,6:500,1:500}[z];else y={2:200,3:200,4:200,9:100,8:100,7:100,1:0,6:0,5:0}[z];return{x:half==='top'?200-x:x,y}}
const SRV_BOT={5:25,7:85,6:150,9:215,1:275},SRV_TOP={1:25,9:85,6:150,7:215,5:275};
function jit(i,k){const s=Math.sin(i*12.9898+k*78.233)*43758.5453;return(s-Math.floor(s))-.5}
function court(acts,mode,col){
  const good=a=>mode==='R'||mode==='D'?'#+'.includes(a.ev)&&a.ev:(a.ev==='#'||(mode==='S'&&a.ev==='/'));
  const bad=a=>mode==='R'||mode==='D'?'=/'.includes(a.ev)&&a.ev:(a.ev==='='||(mode==='A'&&a.ev==='/'));
  const endHalf=mode==='R'||mode==='D'?'bot':'top';
  const cnt={};acts.forEach(a=>{if(!a.ez)return;const c=cnt[a.ez]=cnt[a.ez]||{n:0,g:0};c.n++;if(good(a))c.g++});
  const mx=Math.max(1,...Object.values(cnt).map(c=>c.n)),tot=Object.values(cnt).reduce((s,c)=>s+c.n,0)||1;
  let heat='',lines='',lab='';
  for(let z=1;z<=9;z++){const c=cnt[z];if(!c)continue;const r=zoneRect(endHalf,z);
    heat+=`<rect x="${r.x}" y="${r.y}" width="100" height="100" fill="${col}" fill-opacity="${(.08+.5*c.n/mx).toFixed(2)}"/>`;
    lab+=`<rect x="${r.x+9}" y="${r.y+26}" width="82" height="52" rx="10" class="pill"/><text x="${r.x+50}" y="${r.y+54}" class="zn">${Math.round(c.n/tot*100)}%</text><text x="${r.x+50}" y="${r.y+71}" class="zs">${c.n} · ${mode==='R'||mode==='D'?'pos.':'pts'} ${Math.round(c.g/c.n*100)}%</text>`}
  if(mode!=='D')acts.forEach((a,i)=>{if(!a.ez)return;let x1,y1;
    if(mode==='A'){if(!a.sz)return;const r0=zoneRect('bot',a.sz);x1=r0.x+50+jit(i,1)*50;y1=r0.y+50+jit(i,2)*40}
    else if(mode==='S'){x1=(SRV_BOT[a.sz]??150)+jit(i,1)*14;y1=624}
    else{x1=(SRV_TOP[a.sz]??150)+jit(i,1)*14;y1=-24}
    const r=zoneRect(endHalf,a.ez);const x2=r.x+50+jit(i,3)*72,y2=r.y+50+jit(i,4)*72;const c=good(a)?'g':bad(a)?'b':'n';
    lines+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q ${((x1+x2)/2+jit(i,5)*30).toFixed(1)} ${((y1+y2)/2).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" class="sl ${c}"/><circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="5" class="sd ${c}${mapT(a)!=null?' vid':''}" data-act="${a.id}"><title>Set ${a.set} · ${clk(a.time)} · ${esc(EV_LABEL[a.skill][a.ev]||a.ev)}${mapT(a)!=null?' · vídeo '+vfmt(mapT(a)):''}</title></circle>`});
  return`<svg viewBox="-40 -50 380 700" class="court" role="img" aria-label="Mapa de ${esc(SKILL_NAMES[mode])}">
  <rect x="-30" y="-40" width="360" height="680" rx="12" class="free"/><rect x="0" y="0" width="300" height="600" class="floor"/>${heat}
  <rect x="0" y="0" width="300" height="600" class="cl" fill="none"/><line x1="0" x2="300" y1="200" y2="200" class="cl3"/><line x1="0" x2="300" y1="400" y2="400" class="cl3"/>
  <line x1="-14" x2="314" y1="300" y2="300" class="net"/>${lines}${lab}</svg>`}
function courtLegend(mode){const L={A:['Punto','Error o bloqueado','Sigue la jugada'],S:['Ace o pasada rival','Error de saque','Resto'],R:['Recepción # o +','Error o pasada','! o −']}[mode];
  return`<div class="lg"><span><i class="g"></i>${L[0]}</span><span><i class="b"></i>${L[1]}</span><span><i class="n"></i>${L[2]}</span></div>`}

/* radar */
function radar(axes,col){
  const n=axes.length,R=110,C=150;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;const r=R*clamp(v??0,0,100)/100;return[C+r*Math.cos(a),C+r*Math.sin(a)]};
  let grid='';[25,50,75,100].forEach(g=>{grid+=`<polygon points="${axes.map((_,i)=>pt(i,g).join(',')).join(' ')}" class="rg"/>`});
  axes.forEach((_,i)=>{const[x,y]=pt(i,100);grid+=`<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" class="rg"/>`});
  const poly=k=>axes.map((a,i)=>pt(i,a[k]).join(',')).join(' ');
  const labels=axes.map((a,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const x=C+(R+22)*Math.cos(ang),y=C+(R+22)*Math.sin(ang);const anc=Math.abs(Math.cos(ang))<.2?'middle':Math.cos(ang)>0?'start':'end';
    return`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}" class="rl">${esc(a.label)}</text><text x="${x.toFixed(1)}" y="${(y+19).toFixed(1)}" text-anchor="${anc}" class="rlv">${fp(a.p)} <tspan class="muted">/ ${fp(a.t)}</tspan></text>`}).join('');
  const dots=axes.map((a,i)=>{const[x,y]=pt(i,a.p);return`<circle cx="${x}" cy="${y}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`}).join('');
  return`<svg viewBox="-120 -12 540 334" class="radar" role="img" aria-label="Perfil del jugador comparado con el equipo">${grid}
   <polygon points="${poly('t')}" class="rteam"/><polygon points="${poly('p')}" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`}

function teamList(t){const {M}=st;const nums=[];M.players[t].forEach(p=>{if(!nums.includes(p.num))nums.push(p.num)});

/* ---------- ficha ---------- */

       return L.length>1?`<button class="back" data-player="${pv.p.num}" aria-label="Jugador anterior">‹ #${pv.p.num}</button><button class="back" data-player="${nx.p.num}" aria-label="Jugador siguiente">#${nx.p.num} ›</button>`:''})()}</div>

      <div><b>${d.onCourt.length}</b><span>rallies en pista</span></div>`}
     </div>
    </div>

   </section>

  if(!d.acts.length&&!d.onCourt.length)return hero+`<section class="panel wide"><h2>Sin acciones en este partido</h2><p class="lede">El scout no tiene ninguna acción ni presencia en pista registrada para el #${d.num}. Si jugó, revisa en DataVolley que su dorsal esté bien escrito en los códigos.</p></section>`;

/* aportación punto a punto */
function flowHTML(d){
  const {S}=st;const t=d.t;const W=1000,H=230,gap=18,N=S.setList.reduce((s,x)=>s+x.rallies.length,0);const px=(W-gap*(S.setList.length-1))/N;
  const on=new Set(d.onCourt.map(r=>r.idx));const byR={};d.acts.forEach(a=>{if(a.rally==null)return;(byR[a.rally]=byR[a.rally]||[]).push(a)});
  let cum=0,pts=[],maxAbs=1,x=0,band='',bars='',lab='',sep='';const vals={};
  for(const k in byR)vals[k]=byR[k].reduce((s,a)=>s+val(a),0);

  const donut=`<svg viewBox="0 0 240 240" class="donut" role="img" aria-label="Distribución de sus colocaciones">${arcs}<text x="120" y="118" class="dc">${n}</text><text x="120" y="140" class="dcs">ataques</text></svg>`;

/* ---- Worm (evolución del marcador) ---- */
function wormSVG(setList,{h=170,labels=true,cls=''}={}){
  const W=1000,gap=setList.length>1?22:0,N=setList.reduce((s,x)=>s+x.rallies.length,0);
  const px=(W-gap*(setList.length-1))/Math.max(N,1);
  let maxD=4;setList.forEach(s=>s.rallies.forEach(r=>maxD=Math.max(maxD,Math.abs(r.score[0]-r.score[1]))));
  const top=labels?26:6,bot=6,mid=top+(h-top-bot)/2,amp=(h-top-bot)/2;
  const y=d=>mid-d/maxD*amp;
  let x=0,paths='',lab='',grid='';
  setList.forEach((s,si)=>{
    let d=`M${x.toFixed(1)} ${mid}`;const x0=x;
    s.rallies.forEach(r=>{x+=px;d+=`H${x.toFixed(1)}V${y(r.score[0]-r.score[1]).toFixed(1)}`});
    const area=d+`H${x.toFixed(1)}V${mid}Z`;
    paths+=`<path d="${area}" fill="var(--wh)" clip-path="url(#ca${cls})"/><path d="${area}" fill="var(--wa)" clip-path="url(#cb${cls})"/><path d="${d}" fill="none" stroke="var(--wl)" stroke-width="1.6" stroke-linejoin="round"/>`;
    if(labels)lab+=`<text x="${x0+4}" y="14" class="wl">Set ${s.set}</text><text x="${x-4}" y="14" text-anchor="end" class="ws">${s.score[0]}–${s.score[1]}</text>`;
    if(si<setList.length-1)grid+=`<line x1="${x+gap/2}" x2="${x+gap/2}" y1="${top-4}" y2="${h-bot}" class="wg"/>`;
    x+=gap;
  });
  return`<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" class="worm" role="img" aria-label="Diferencia de puntos a lo largo del partido">
  <defs><clipPath id="ca${cls}"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="cb${cls}"><rect x="0" y="${mid}" width="${W}" height="${h}"/></clipPath></defs>
  <line x1="0" x2="${W}" y1="${mid}" y2="${mid}" class="wz"/>${grid}${paths}${lab}</svg>`;
}

/* ---- Resumen ---- */
function mirror(label,a,b,{fmt=v=>v??'–',max,hint=''}={}){
  const av=a??0,bv=b??0,mx=max||Math.max(av,bv,1);
  return`<div class="mrow"${hint?` title="${esc(hint)}"`:''}><div class="mlab">${label}</div>
   <div class="mv ${av>bv?'best':''}">${fmt(a)}</div><div class="mb l"><span style="width:${Math.max(0,av/mx*100)}%"></span></div>
   <div class="mb r"><span style="width:${Math.max(0,bv/mx*100)}%"></span></div><div class="mv r ${bv>av?'best':''}">${fmt(b)}</div></div>`;
}
function resumenHTML(){
  const {M,S}=st;const [h,v]=S.team;

    mirror('Aces',h.serve.ace,v.serve.ace),
    mirror('Puntos por error rival',h.oppErr,v.oppErr),
    mirror('Side-out',pct(h.so.won,h.so.n),pct(v.so.won,v.so.n),{...P,hint:'Puntos ganados en recepción sobre rallies en recepción'}),
    mirror('Break point',pct(h.bp.won,h.bp.n),pct(v.bp.won,v.bp.n),{...P,hint:'Puntos ganados con saque propio'}),
    mirror('Ataque: % de puntos',pct(h.att.kill,h.att.n),pct(v.att.kill,v.att.n),P),
    mirror('Ataque: eficacia',eff(h),eff(v),{...P,hint:'(puntos − errores − bloqueados) / total'}),
    mirror('Recepción positiva',pct(h.rec.pos,h.rec.n),pct(v.rec.pos,v.rec.n),{...P,hint:'# y + sobre el total'}),
    mirror('Recepción perfecta',pct(h.rec.perf,h.rec.n),pct(v.rec.perf,v.rec.n),P),
  ].join('');
  const origin=[0,1].map(t=>{const x=S.team[t];const parts=[['Ataque',x.att.kill],['Bloqueo',x.block.pts],['Saque',x.serve.ace],['Error rival',Math.max(0,x.oppErr)]];const tot=parts.reduce((s,p)=>s+p[1],0)||1;

    <div class="kline"><span>Contraataque</span><b>${fp(pct(x.k2.kill,x.k2.n))}</b><small>${x.k2.kill}/${x.k2.n} · ef. ${fp(e(x.k2))}</small></div></div>`}).join('');
  // Recepción -> ataque
  const qs=[['#','Perfecta'],['+','Positiva'],['!','Regular'],['-','Mala']];
  const bw=40,gw=150,H=190,base=160;
  let bars='';qs.forEach(([q,l],i)=>{const gx=30+i*gw;[0,1].forEach(t=>{const d=S.team[t].recToAtt[q];const p=pct(d.kill,d.n);const hh=p==null?0:p/100*130;const x=gx+t*(bw+8);
    bars+=`<rect x="${x}" y="${base-hh}" width="${bw}" height="${hh}" rx="3" fill="${TC[t]}"><title>${esc(M.teams[t].name)}: ${d.kill}/${d.n}</title></rect><text x="${x+bw/2}" y="${base-hh-6}" class="bv">${fp(p)}</text><text x="${x+bw/2}" y="${base+14}" class="bn">${d.n}</text>`});
    bars+=`<text x="${gx+bw+4}" y="${base+32}" class="bl">${q} ${l}</text>`});
  const rta=`<svg viewBox="0 0 620 ${H+8}" class="chart rta" role="img" aria-label="Porcentaje de punto del primer ataque según la calidad de recepción"><line x1="20" x2="600" y1="${base}" y2="${base}" class="ax"/>${bars}</svg>`;
  // sets
  const setCards=S.setList.map(s=>{const rs=S.runs.filter(r=>r.set===s.set).slice(0,2);
    return`<div class="setcard"><div class="sch"><b>Set ${s.set}</b><span class="${s.winner?'ta':'th'}">${s.score[0]}–${s.score[1]}</span></div>${wormSVG([s],{h:90,labels:false,cls:'s'+s.set})}

  return`<div class="grid g-res">
   <section class="panel face"><h2>Cara a cara</h2><div class="fhead"><span class="th">${esc(M.teams[0].name)}</span><span class="ta">${esc(M.teams[1].name)}</span></div>${face}</section>
   <div class="stack">
    <section class="panel"><h2>De dónde salen los puntos</h2>${origin}</section>
    <section class="panel"><h2>Ataque según la fase</h2><div class="kkw">${kk}</div></section>

   <section class="panel wide"><h2>Set a set</h2><div class="setcards">${setCards}</div></section>

/* tiempos añadidos a mano: st.manual = {idAcción: segundo}; ajustes de otra grabación: st.sync = [{id,v}] */
function anchorsNow(){return Object.entries(st.manual||{}).map(([id,v])=>({id:+id,v})).filter(x=>st.M.actions[x.id]).sort((p,q)=>p.id-q.id)}
function syncNow(){return(st.sync||[]).filter(x=>st.M.actions[x.id]&&st.M.actions[x.id].video!=null).sort((p,q)=>p.id-q.id)}
function offsetFor(a){const S=syncNow();if(!S.length)return 0;let P=S[0];for(const x of S){if(x.id<=a.id)P=x;else break}return P.v-st.M.actions[P.id].video}
function mapT(a){if(!a)return null;const m=st.manual&&st.manual[a.id];if(m!=null)return m;if(a.video==null)return null;return Math.max(0,a.video+offsetFor(a))}
const syncKey=()=>'vsync3:'+(st.file||'')+':'+(st.M?st.M.match.date+':'+st.M.actions.length:'');
function saveSync(){try{localStorage.setItem(syncKey(),JSON.stringify({manual:st.manual,sync:st.sync,videoName:st.videoName||''}))}catch(e){}}

/* ---------- exportar el .dvw con la cronología ---------- */
const CP1252={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function encodeText(t,enc,bom){if(enc!=='windows-1252'){const u=new TextEncoder().encode(t);if(!bom)return u;const o=new Uint8Array(u.length+3);o.set([0xEF,0xBB,0xBF]);o.set(u,3);return o}
  const o=new Uint8Array(t.length);for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);o[i]=c<0x80||(c>=0xA0&&c<=0xFF)?c:(CP1252[c]||0x3F)}return o}
function buildDVW(){const M=st.M;const L=M.lines.slice();let last=null,n=0;
  M.scoutIdx.forEach(e=>{let t;if(e.act){t=mapT(e.act);last=t}else t=last;
    const f=L[e.li].split(';');if(t==null){return}
    while(f.length<14)f.push('');f[12]=String(Math.round(t));if(!f[11]||!f[11].trim())f[11]='1';L[e.li]=f.join(';');if(e.act)n++});
  const name=st.videoName||M.video||'video.mp4';
  let vi=L.findIndex(l=>/^\[3VIDEO\]/.test(l));
  if(vi>=0){let k=vi+1,done=false;while(k<L.length&&!/^\[/.test(L[k])){if(/^Camera0=/.test(L[k])){L[k]='Camera0='+name;done=true}k++}if(!done)L.splice(vi+1,0,'Camera0='+name)}
  else{const si=L.findIndex(l=>/^\[3SCOUT\]/.test(l));L.splice(si,0,'[3VIDEO]','Camera0='+name)}
  return{text:L.join(M.eol),n}}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipOne(name,data){const nm=new TextEncoder().encode(name);const crc=crc32(data);const d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const lh=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,dt,2],[12,dd,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?lh.setUint32(o,v,true):lh.setUint16(o,v,true));
  const ch=new DataView(new ArrayBuffer(46));[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,dt,2],[14,dd,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,0,4]].forEach(([o,v,s])=>s===4?ch.setUint32(o,v,true):ch.setUint16(o,v,true));
  const cdOff=30+nm.length+data.length,cdSize=46+nm.length;
  const end=new DataView(new ArrayBuffer(22));[[0,0x06054b50,4],[4,0,2],[6,0,2],[8,1,2],[10,1,2],[12,cdSize,4],[16,cdOff,4],[20,0,2]].forEach(([o,v,s])=>s===4?end.setUint32(o,v,true):end.setUint16(o,v,true));
  return new Blob([lh.buffer,nm,data,ch.buffer,nm,end.buffer],{type:'application/zip'})}
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(x=>{DL=x}).catch(()=>{})}catch(e){}
async function exportDVW(){const cov=coverage();if(!cov.k){showErr('Todavía no hay ninguna acción con tiempo de vídeo. Añade tiempos desde la pestaña Vídeo.');return}
  const {text,n}=buildDVW();const bytes=encodeText(text,st.M.enc,st.M.bom);
  const base=(st.file||'partido.dvw').replace(/\.dvw$/i,'').replace(/_cronologia$/,'')+'_cronologia';
  const msg=$('#expmsg');const say=(t,ok)=>{if(msg){msg.textContent=t;msg.className='expmsg '+(ok?'ok':'ko')}};
  try{
    if(DL){await DL.save({filename:base+'.zip',data:zipOne(base+'.dvw',bytes)});say(`Guardado: ${base}.zip. Dentro está ${base}.dvw con ${n} acciones con tiempo de vídeo.`,true)}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));a.download=base+'.dvw';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);say(`Descargado ${base}.dvw con ${n} acciones con tiempo de vídeo.`,true)}
  }catch(e){say(e&&e.code==='declined'?'Has cancelado la descarga.':'No se ha podido guardar el archivo en esta vista ('+((e&&(e.code||e.message))||e)+').',false);return}
  // recargar el archivo nuevo para trabajar ya con los tiempos incrustados
  const keepVid=st.videoName;load(text,base+'.dvw');st.videoName=keepVid;st.tab='video';render()}

  const pill=(txt,bg,fg='#fff',dot)=>{const w=ctx.measureText(txt).width+(dot?44:28)*k;ctx.fillStyle=bg;rr(ctx,x,y,w,h,h/2);ctx.fill();if(dot){ctx.fillStyle=dot;ctx.beginPath();ctx.arc(x+20*k,y+h/2,6*k,0,7);ctx.fill()}ctx.fillStyle=fg;ctx.fillText(txt,x+(dot?32:14)*k,y+h/2+1);x+=w+8*k};
  pill(`Set ${a.set} · ${r?r.before[0]+'–'+r.before[1]:''}`,'rgba(10,16,32,.8)');
  pill(a.num!=null?`#${a.num} ${p?shortName(p):''}`:M.teams[a.team].name,'rgba(10,16,32,.8)','#fff',a.team?'#F7B53A':'#6D9BFF');
  pill(SKILL_NAMES[a.skill],SKC[a.skill]||'#333');
  const qi=(EV_ORDER[a.skill]||[]).indexOf(a.ev);if(a.ev)pill((EV_LABEL[a.skill]||{})[a.ev]||a.ev,QCH[qi]||'#555');
  ctx.font=`600 ${Math.round(18*k)}px Barlow, system-ui, sans-serif`;const t2=`${M.teams[0].name} – ${M.teams[1].name}   ${i+1}/${n}`;const w2=ctx.measureText(t2).width+24*k;
  ctx.fillStyle='rgba(10,16,32,.7)';rr(ctx,W-w2-20*k,H-52*k,w2,34*k,8*k);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(t2,W-w2-8*k,H-35*k)}
function drawTitle(ctx,W,H){const M=st.M,S=st.S;const k=W/1280;ctx.fillStyle='#101A31';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2356D8';ctx.fillRect(0,H-12*k,W/2,12*k);ctx.fillStyle='#E0930A';ctx.fillRect(W/2,H-12*k,W/2,12*k);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#9AA8C1';ctx.font=`600 ${Math.round(26*k)}px Barlow, system-ui, sans-serif`;
  ctx.fillText([M.match.phase,M.match.league,M.match.date].filter(Boolean).join('  ·  '),W/2,H*.22);
  ctx.fillStyle='#fff';ctx.font=`800 ${Math.round(58*k)}px "Barlow Condensed", Barlow, sans-serif`;ctx.fillText(`${M.teams[0].name}  ${S.setsWon[0]} – ${S.setsWon[1]}  ${M.teams[1].name}`,W/2,H*.4,W*.92);
  ctx.font=`700 ${Math.round(44*k)}px "Barlow Condensed", Barlow, sans-serif`;ctx.fillStyle='#F3F6FB';ctx.fillText(reelDesc(),W/2,H*.6,W*.9);
  ctx.font=`500 ${Math.round(24*k)}px Barlow, system-ui, sans-serif`;ctx.fillStyle='#9AA8C1';ctx.fillText(S.setList.map(s=>s.score.join('-')).join('   '),W/2,H*.72);ctx.textAlign='left'}
async function startRec(){const v=$('#vid');const vw=v.videoWidth||1280,vh=v.videoHeight||720;const W=Math.max(960,Math.min(1280,vw))&~1,H=Math.round(W*vh/vw)&~1;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');const stream=cv.captureStream(30);
  try{if(!AUD){const C=window.AudioContext||window.webkitAudioContext;const ac=new C();const src=ac.createMediaElementSource(v);const dest=ac.createMediaStreamDestination();src.connect(ac.destination);src.connect(dest);AUD={ac,dest}}
    await AUD.ac.resume();AUD.dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){}
  const mime=pickMime();let mr;try{mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6e6}:{videoBitsPerSecond:6e6})}catch(e){showErr('Este navegador no ha podido empezar a grabar el vídeo.');return null}
  const R={mr,chunks:[],cv,ctx,W,H,mime:mr.mimeType||mime||'video/webm',mode:'video',clip:null,on:true};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
  const draw=()=>{if(!R.on)return;if(R.mode==='title')drawTitle(ctx,W,H);else{try{ctx.drawImage(v,0,0,W,H)}catch(e){}
      if(st.reel.label&&R.clip){const run=st.reelRun;drawOverlay(ctx,W,H,st.M.actions[curAct(R.clip.ids,v.currentTime)],run?run.i:0,run?run.clips.length:1)}}};
  R.timer=setInterval(draw,1000/30);draw();mr.start(1000);return R}
function stopRec(R){return new Promise(res=>{R.on=false;clearInterval(R.timer);R.mr.onstop=()=>res(new Blob(R.chunks,{type:R.mime.split(';')[0]}));try{if(R.mr.state==='paused')R.mr.resume();R.mr.stop()}catch(e){res(new Blob(R.chunks))}})}
async function runReel(mode){if(st.reelRun)return;const clips=reelClips();if(!clips.length||!st.videoOk)return;const v=$('#vid');
  const tok={stop:false,goto:null,paused:false};st.reelRun={tok,clips,i:0,mode};st.lastReel=null;st.follow=false;
  document.querySelectorAll('.reelbtns button').forEach(b=>b.disabled=true);updReelBar();const ov=$('#vover');
  let R=null;if(mode==='rec'){v.pause();R=await startRec();if(!R){st.reelRun=null;updReelBar();return}
    if(st.reel.title){R.mode='title';R.mr.resume&&0;await sleep(2500);R.mode='video'}}
  const t0=Date.now();
  for(let i=0;i<clips.length;i++){if(tok.stop)break;st.reelRun.i=i;updReelBar();const c=clips[i];
    if(R){R.mr.state==='recording'&&R.mr.pause();R.clip=c}
    v.pause();v.currentTime=c.s;await waitSeek(v);if(R&&R.mr.state==='paused')R.mr.resume();
    if(!tok.paused)await v.play().catch(()=>{});
    await waitClipEnd(v,c.e,tok);
    if(tok.goto!=null){i=tok.goto-1;tok.goto=null;continue}}
  v.pause();const run=st.reelRun;st.reelRun=null;
  if(R){const blob=await stopRec(R);if(!tok.stop&&blob.size){const ext=/mp4/.test(R.mime)?'mp4':'webm';
      const base=(reelDesc()+' - '+st.M.teams[0].name+' vs '+st.M.teams[1].name).replace(/[\\/:*?"<>|#]+/g,'').replace(/\s+/g,' ').trim().slice(0,120);
      st.lastReel={blob,name:base+'.'+ext,dur:clips.reduce((a,c)=>a+(c.e-c.s),0)}}}
  const rp=document.querySelector('.reelp');if(rp)rp.outerHTML=reelHTML();else updReelBar()}
async function saveReel(){const L=st.lastReel;if(!L)return;const msg=$('#reelmsg');const say=(t,ok)=>{if(msg){msg.textContent=t;msg.className='expmsg '+(ok?'ok':'ko')}};
  try{if(DL){await DL.save({filename:L.name,data:L.blob});say('Vídeo guardado.',true)}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(L.blob);a.download=L.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);say('Vídeo descargado.',true)}}
  catch(e){say(e&&e.code==='declined'?'Has cancelado la descarga.':'No se ha podido guardar el vídeo ('+((e&&(e.code||e.message))||e)+').',false)}}
function reelCmd(k){const run=st.reelRun;const v=$('#vid');
  if(k==='play'||k==='rec')return runReel(k);
  if(k==='save')return saveReel();
  if(k==='clear'){st.lastReel=null;updReelBar();return}
  if(!run)return;
  if(k==='stop'){run.tok.stop=true;return}
  if(k==='next'){run.tok.goto=Math.min(run.clips.length,run.i+1);return}
  if(k==='prev'){run.tok.goto=Math.max(0,run.i-1);return}
  if(k==='pause'){run.tok.paused=!run.tok.paused;run.tok.paused?v.pause():v.play().catch(()=>{})}}

function bindReel(){[['rbefore','before'],['rafter','after']].forEach(([id,k])=>{const x=$('#'+id);if(x)x.onchange=e=>{st.reel[k]=+e.target.value;const rp=document.querySelector('.reelp');if(rp)rp.outerHTML=reelHTML();bindReel()}});
  [['rlabel','label'],['rtitle','title']].forEach(([id,k])=>{const x=$('#'+id);if(x)x.onchange=e=>{st.reel[k]=e.target.checked}})}
/* ---------- render ---------- */
const TABS=[['resumen','Resumen'],['stats','Estadísticas'],['rot','Rotaciones'],['maps','Mapas de juego'],['fichas','Fichas de jugador'],['video','Vídeo']];
function render(){const main=$('#main');
  $('#pickbtn').hidden=!st.M;$('#fname').textContent=st.file||'';
  parkVideo();
  if(!st.M){main.innerHTML=emptyHTML();placeVideo();return}
  const nav=`<nav class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" aria-selected="${st.tab===k}" class="${st.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</nav>`;
  let body;
  try{
  if(st.tab==='video'){body=videoHTML();document.documentElement.style.setProperty('--acc','var(--home)')}
  else if(st.tab==='fichas'){body=st.num==null?pickHTML():playerHTML();document.documentElement.style.setProperty('--acc',TCOL[st.team])}
  else{document.documentElement.style.setProperty('--acc','var(--home)');
    const hero=heroHTML().replace('<section class="hero">',`<section class="hero${st.fresh?' fresh':''}">`);
    body=hero+`<div class="tabbody">${({resumen:resumenHTML,stats:jugadoresHTML,rot:rotacionesHTML,maps:mapaHTML})[st.tab]()}</div>`}
  }catch(err){console.error(err);body=`<section class="panel wide errp"><h2>No se ha podido mostrar esta vista</h2><p class="lede">Algo de este archivo no encaja con lo que espera la aplicación (${esc(err&&err.message||err)}). El resto de pestañas siguen funcionando.</p><button class="btn" data-back>Volver a los jugadores</button></section>`}
  main.innerHTML=nav+body;st.fresh=false;placeVideo();if(st.tab==='video'){lastNow=null;markCurrent(true);const sr=st.sel!=null&&document.getElementById('vr'+st.sel);if(sr&&!st.videoOk){}}
  const sel=$('#mplayer');if(sel)sel.onchange=e=>{st.mPlayer=e.target.value;renderKeep()};
  [['vfplayer','player'],['vfset','set'],['vfev','ev']].forEach(([id,k])=>{const x=$('#'+id);if(x)x.onchange=e=>{st.vf[k]=e.target.value;renderKeep()}});
  const fo=$('#follow');if(fo)fo.onchange=e=>{st.follow=e.target.checked};
  [['rbefore','before'],['rafter','after']].forEach(([id,k])=>{const x=$('#'+id);if(x)x.onchange=e=>{st.reel[k]=+e.target.value;const rp=document.querySelector('.reelp');if(rp)rp.outerHTML=reelHTML();bindReel()}});bindReel();
  const rc=$('#react');if(rc)rc.onchange=e=>{st.react=+e.target.value};
  if(st.tab==='video'&&st.tag)tagRefresh();
}
function emptyHTML(){return`<section class="empty"><div class="jersey" aria-hidden="true"><span>?</span></div>
  <h1>Informe del partido</h1><p>Arrastra aquí el archivo <b>.dvw</b> del partido o ábrelo desde tu ordenador. Verás el informe del equipo (resumen, estadísticas, rotaciones y mapas) y la ficha completa de cada jugador con su registro y el vídeo. El archivo se lee en tu navegador y no se sube a ningún sitio.</p>
  <div class="ebtn"><label class="btn primary big">Abrir archivo .dvw<input type="file" accept=".dvw" class="fin"></label><button class="btn big" data-demo>Ver un partido de ejemplo</button></div></section>`}

/* ---------- eventos ---------- */
function openPlayer(t,num){st.team=t;st.num=num;st.tab='fichas';st.logF='all';st.open=null;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-team],[data-skill],[data-demo],th[data-k],[data-act],[data-player],[data-back],[data-logf],#pickbtn,#vclose,#vmin,[data-row],[data-sel],[data-vb],[data-nudge],[data-sync],[data-unanchor],[data-vbase],[data-vf],[data-export],[data-tag],[data-rate],[data-reel],[data-reelplayer],[data-addt],[data-delt]');if(!b)return;
  if(b.id==='pickbtn'||b.hasAttribute('data-back')){st.tab='fichas';st.num=null;render();window.scrollTo(0,0)}
  else if(b.id==='vclose'){$('#vid').pause();$('#vbox').hidden=true;st.vboxHidden=true}
  else if(b.id==='vmin'){$('#vbox').classList.toggle('min')}
  else if(b.dataset.tab){st.tab=b.dataset.tab;if(st.tab==='fichas')st.num=null;renderKeep()}
  else if(b.dataset.team){const[k,v]=b.dataset.team.split(':');st[k]=+v;if(k==='mTeam')st.mPlayer='all';renderKeep()}
  else if(b.dataset.skill){st.mSkill=b.dataset.skill;st.mPlayer='all';renderKeep()}
  else if(b.hasAttribute('data-demo')){load(makeDemoDVW(),'Partido de ejemplo')}
  else if(b.dataset.k){if(st.sort===b.dataset.k)st.sortDir*=-1;else{st.sort=b.dataset.k;st.sortDir=b.dataset.k==='name'||b.dataset.k==='num'?1:-1}renderKeep()}
  else if(b.dataset.player){openPlayer(b.dataset.pteam!=null?+b.dataset.pteam:st.team,+b.dataset.player)}
  else if(b.dataset.logf){st.logF=b.dataset.logf;renderKeep()}
  else if(b.dataset.act!=null){e.stopPropagation();seekAct(+b.dataset.act)}
  else if(b.dataset.sel!=null&&st.tag){const id=+b.dataset.sel;if(mapT(st.M.actions[id])!=null)seekAct(id);else tagCmd('goto',id)}
  else if(b.dataset.sel!=null){const id=+b.dataset.sel;st.sel=id;document.querySelectorAll('.vrow.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(st.videoOk&&mapT(st.M.actions[id])!=null)seekAct(id);const sb=document.querySelector('[data-sync]');if(sb){const a=st.M.actions[id];sb.disabled=!st.videoOk;sb.textContent=`Fijar: ${SKILL_NAMES[a.skill]} de #${a.num??''} (${clk(a.time)}) ocurre ahora`}}
  else if(b.dataset.vb){const v=$('#vid');const k=b.dataset.vb;if(k==='play'){v.paused?v.play().catch(()=>{}):v.pause()}else stepAct(k.endsWith('prev')?-1:1,k.startsWith('r'))}
  else if(b.dataset.nudge){const v=$('#vid');v.currentTime=Math.max(0,v.currentTime+parseFloat(b.dataset.nudge))}
  else if(b.hasAttribute('data-sync')){const a=st.M.actions[st.sel];if(!a||a.video==null)return;const v=$('#vid');const p=a.num!=null?st.M.nameOf(a.team,a.num):null;
    addSync(a,v.currentTime);renderKeep()}
  else if(b.dataset.unanchor!=null){const S=syncNow();const x=S[+b.dataset.unanchor];if(x)st.sync=st.sync.filter(q=>q.id!==x.id);saveSync();renderKeep()}
  else if(b.dataset.addt!=null){e.stopPropagation();const a=st.M.actions[+b.dataset.addt];const v=$('#vid');if(a&&st.videoOk){addAnchor(a,Math.max(0,v.currentTime-(st.react||0)));const row=document.getElementById('vr'+a.id);if(row)row.classList.add('marked');tagRefresh()}}
  else if(b.dataset.delt!=null){e.stopPropagation();delete st.manual[+b.dataset.delt];saveSync();const row=document.getElementById('vr'+b.dataset.delt);if(row)row.classList.remove('marked');tagRefresh()}
  else if(b.hasAttribute('data-export')){exportDVW()}
  else if(b.dataset.tag){tagCmd(b.dataset.tag)}
  else if(b.dataset.reel){reelCmd(b.dataset.reel)}
  else if(b.dataset.reelplayer){const[t,n]=b.dataset.reelplayer.split(':');st.vf={team:t,player:n,skill:st.logF==='all'?'all':st.logF,set:'all',ev:'all'};st.tab='video';render();window.scrollTo(0,0)}
  else if(b.dataset.rate){$('#vid').playbackRate=+b.dataset.rate;tagRefresh()}
  else if(b.dataset.vbase){st.vbase=b.dataset.vbase;saveSync();renderKeep()}
  else if(b.dataset.vf&&st.reelRun){}
  else if(b.dataset.vf){const[k,v]=b.dataset.vf.split(':');st.vf[k]=v;if(k==='team')st.vf.player='all';renderKeep()}
  else if(b.dataset.row){const k=+b.dataset.row;st.open=st.open===k?null:k;renderKeep()}});
document.addEventListener('keydown',e=>{
  if(st.tag&&st.tab==='video'&&!e.target.closest('input,select,textarea')){const v=$('#vid');
    if(e.key==='Enter'||e.key==='m'||e.key==='M'){e.preventDefault();tagCmd('mark');return}
    if(e.key==='Backspace'||e.key==='z'||e.key==='Z'){e.preventDefault();tagCmd('undo');return}
    if(e.key==='x'||e.key==='X'){e.preventDefault();tagCmd('skip');return}
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();v.currentTime=Math.max(0,v.currentTime+(e.key==='ArrowLeft'?-2:2));return}
    if(e.key===' '){e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause();return}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-row],th[data-k],[data-sel]')){e.preventDefault();e.target.click();return}
  if(st.tab!=='video'||!st.videoOk||e.target.closest('input,select,textarea'))return;
  if(e.key==='ArrowRight'){e.preventDefault();stepAct(1,e.shiftKey)}else if(e.key==='ArrowLeft'){e.preventDefault();stepAct(-1,e.shiftKey)}
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();const v=$('#vid');v.paused?v.play().catch(()=>{}):v.pause()}});
document.addEventListener('change',e=>{if(e.target.matches('.fin')){readFile(e.target.files[0]);e.target.value=''}else if(e.target.matches('.vin')){loadVideo(e.target.files[0]);e.target.value=''}else if(e.target.id==='pre'){st.pre=+e.target.value}});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==='dragleave'&&e.relatedTarget)return;document.body.classList.remove('drag')}));
document.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f)return;if(/^video\//.test(f.type))loadVideo(f);else readFile(f)});
render();

</script>
